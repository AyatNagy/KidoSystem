name: kido
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  confetti: ^0.7.0
  flip_card: ^0.7.0
  cupertino_icons: ^1.0.8
  device_preview: ^1.2.0
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.1.1
  audioplayers: ^6.5.1
  flutter_tts: ^4.2.3
  dio: ^5.7.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  lottie: ^3.1.2
  flutter_bloc: ^8.1.6
  speech_to_text: ^7.3.0
  smooth_page_indicator: ^1.1.0
  signature: ^5.5.0
  simple_shadow: ^0.3.1
  flutter_animate: ^4.5.0
  motion_toast: ^2.9.1
  rive: ^0.14.3
  video_player: ^2.8.1
  image_picker: ^1.2.2
  animate_do: ^4.2.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/Characters/
    - assets/images/arabicLetters/
    - assets/images/letters/
    - assets/images/sizes/
    - assets/images/fruits/
    - assets/lottie/
    - assets/audio/
    - assets/audio/numeric_en/
    - assets/audio/numeric_ar/
    - assets/audio/fruits/
    - assets/audio/sizes/
    - assets/audio/senses/
    - assets/audio/alphabet_ar/
    - assets/audio/alphabet_en/
    - assets/videos/
    - assets/videos/Body_parts/
    - assets/images/cartoonVegetable/
    - assets/gif/
    - assets/images/family/
    - assets/images/familyIcons/
    - assets/images/arabicNumbers/
    - assets/images/englishNumbers/
    - assets/images/common/
    - assets/images/family_members/
    - assets/audio/family/
    - assets/images/level1/
    - assets/images/drawing/
    - assets/images/senses/
    - assets/images/clean/
    - assets/images/shapes/
    - assets/images/clean/Trash/
    - assets/images/puzzle/
    - assets/images/matching/
    - assets/images/animals/
    - assets/audio/animals/
    - assets/audio/level1/
    - assets/audio/shapes/
    - assets/audio/exams/

  fonts:
    - family: tinyKids
      fonts:
        - asset: assets/fonts/tiny-kids.otf
    - family: nunito
      fonts:
        - asset: assets/fonts/Nunito/Nunito-VariableFont_wght.ttf
    - family: poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
    - family: montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-VariableFont_wght.ttf
          weight: 400
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka/static/Fredoka-SemiBold.ttf
          weight: 400